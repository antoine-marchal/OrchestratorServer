[package]
name = "orchestrator"
version = "0.2.0"
description = "Orchestrator Desktop App"
authors = ["Antoine Marchal"]
edition = "2021"

[lib]
name = "orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
