[package]
name = "orchestrator-client"
version = "0.2.1"
description = "Orchestrator Desktop App"
authors = ["Antoine Marchal"]
edition = "2021"

[package.metadata]
copyright = "Antoine Marchal 2026"

[lib]
name = "orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
